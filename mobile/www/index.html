<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What to Eat</title>
<style>
  :root { --cream:#FBF7F0; --ink:#2B2723; --muted:#776D65; --accent:#B4572F; --sage:#5A7656; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--cream); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; justify-content:center; gap:12px;
    padding:calc(env(safe-area-inset-top) + 24px) 28px calc(env(safe-area-inset-bottom) + 32px); max-width:28rem; margin:0 auto; }
  .dot { width:56px; height:56px; border-radius:18px; background:#EEF2EC; display:grid; place-items:center; margin-bottom:8px; }
  h1 { font-size:26px; letter-spacing:-0.02em; margin:0; }
  p { color:var(--muted); margin:0; line-height:1.5; }
  button { margin-top:16px; min-height:52px; border:0; border-radius:16px; background:var(--accent); color:#fff;
    font:600 17px/1 inherit; font-family:inherit; }
  button:active { opacity:.85; }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="dot" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7F9A7A" stroke-width="2" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1"/></svg>
  </div>
  <h1>Can't reach the kitchen</h1>
  <p>Ideas are made fresh for you, so this needs a connection. Check Wi-Fi or mobile data, then try again.</p>
  <button id="retry" type="button">Try again</button>
  <small id="note" role="status" aria-live="polite"></small>
</main>
<script src="app-url.js"></script>
<script>
  // app-url.js is written by scripts/ios-sync.mjs from CAP_SERVER_URL: the hosted app's address.
  var target = window.APP_URL;
  document.getElementById("retry").addEventListener("click", function () {
    document.getElementById("note").textContent = "Trying…";
    if (target) window.location.replace(target); else window.location.reload();
  });
</script>
</body>
</html>
