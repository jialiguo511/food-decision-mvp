<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bundled UI check</title>
<style>
  :root { --cream:#FBF7F0; --ink:#2B2723; --muted:#776D65; --accent:#B4572F; --line:#EAE2D6; --sage:#5A7656; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:-apple-system, system-ui, sans-serif; }
  main { padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 24px); max-width:28rem; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
  ol { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
  li { background:#FFFDF9; border:1px solid var(--line); border-radius:14px; padding:10px 12px; font-size:14px; }
  li b { display:block; } li span { color:var(--muted); word-break:break-word; }
  .pass b::before { content:"✅ "; } .fail b::before { content:"❌ "; } .wait b::before { content:"⏳ "; }
  input, button { width:100%; min-height:44px; border-radius:12px; font-size:16px; margin-top:8px; }
  input { border:1px solid var(--line); padding:0 12px; background:#fff; }
  button { border:0; background:var(--accent); color:#fff; font-weight:600; }
  section { margin-top:18px; }
</style>
</head>
<body>
<main>
  <h1>Bundled UI check</h1>
  <p class="sub">This screen ships inside the app. It talks to the real backend from the app's own origin.</p>
  <ol id="checks"></ol>
  <section>
    <b>Email code sign-in (from the bundled screen)</b>
    <div id="captcha"></div>
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="test address">
    <button id="send" type="button">Send code</button>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="code from the email">
    <button id="verify" type="button">Sign in</button>
    <button id="signout" type="button" style="background:#fff;color:var(--ink);border:1px solid var(--line)">Sign out (clears the stored session)</button>
  </section>
</main>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="poc.js"></script>
</body>
</html>
